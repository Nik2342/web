<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>contact</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="card">
    <div class="row">
        <div class="col-md-2">
            <div data-bs-theme="dark">
                <div class="card" style="max-width: 16rem; height: 950px;">
                    <h5><span class="badge text-bg-info mb-3 text-dark">В</span> Меню</h5>
                    <div class="list-group">
                        <a href="#" class="list-group-item list-group-item-action" aria-current="true">
                            Главная
                        </a>
                        <a href="#" class="list-group-item list-group-item-action">Категории</a>
                        <a href="#" class="list-group-item list-group-item-action">Каталог</a>
                        <a href="#" class="list-group-item list-group-item-action active">Контакты</a>
                    </div>
                    <div class="btn-group position-absolute bottom-0 start-0">
                        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                            Пользователь
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Выход</a></li>
                            <li><a class="dropdown-item" href="#">Профиль</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-9 text-black text-center ">
            <div><h1>Контакты</h1></div>
            <div class="container d-flex">
                <div class="card col-5 p-4 me-3">
                    <div class="mb-3">
                        <label for="nameInput" class="form-label">Имя</label>
                        <input id="nameInput" class="form-control" type="text">
                    </div>
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text" id="basic-addon1">@</span>
                            <input id="emailInput" type="text" class="form-control"
                                   aria-label="email" aria-describedby="basic-addon1">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="messageTextarea" class="form-label">Сообщение</label>
                        <textarea id="messageTextarea" class="form-control"></textarea>
                    </div>
                    <button type="button" class="btn btn-outline-primary mt-5">Отправить</button>
                </div>

                <div class="card col-5 p-4">
                    <h3>Наши контакты</h3>
                    <p class="card-text">Базовый текст Фотошопа</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
